{% extends "base.html" %}
{% block title %}Admin Login - AFRI Trans{% endblock %}
{% block content %}
<div style="max-width:400px; margin:60px auto;">
    <div class="card" style="padding:32px; text-align:center;">
        <div style="font-size:40px; margin-bottom:12px;"><i class="fas fa-user-shield" style="color:#c62828;"></i></div>
        <h2 style="font-size:20px; margin-bottom:4px;">Super Admin</h2>
        <p style="color:#888; font-size:13px; margin-bottom:20px;">Enter admin password to access the dashboard</p>
        <form method="POST">
            <div class="form-group" style="text-align:left; margin-bottom:16px;">
                <label style="font-weight:600; font-size:14px; display:block; margin-bottom:6px;">Password</label>
                <input type="password" name="password" class="form-control" required placeholder="Enter password" style="width:100%; padding:12px; border:2px solid #e0e0e0; border-radius:10px; font-size:15px; box-sizing:border-box;">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; font-size:15px;">Login</button>
        </form>
        <div style="margin-top:16px;">
            <a href="{{ url_for('index') }}" style="color:#888; font-size:13px;">&larr; Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
