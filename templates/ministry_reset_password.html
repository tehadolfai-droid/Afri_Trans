{% extends "base.html" %}
{% block title %}{{ _('Reset Password') }}{% endblock %}
{% block content %}
<div style="max-width:400px; margin:60px auto;">
    <div class="card" style="text-align:center;">
        <div style="font-size:48px; margin-bottom:8px;"><i class="fas fa-lock-open" style="color:#27ae60;"></i></div>
        <h2 style="color:#1a1a2e; font-size:20px; margin-bottom:4px;">{{ _('Reset Password') }}</h2>
        <p style="color:#888; font-size:13px; margin-bottom:20px;">{{ _('Choose a new password for your super admin account.') }}</p>
        <form method="POST">
            <div class="form-group">
                <input type="password" name="password" class="form-control pw-field" placeholder="{{ _('New password (min 6 chars)') }}" required minlength="6" autofocus>
            </div>
            <div class="form-group">
                <input type="password" name="confirm_password" class="form-control pw-field" placeholder="{{ _('Confirm new password') }}" required minlength="6">
            </div>
            <div style="text-align:right; margin-bottom:10px;">
                <label class="pw-toggle"><input type="checkbox" onchange="toggleAllPasswords(this)"> {{ _('Show passwords') }}</label>
            </div>
            <button type="submit" class="btn btn-success" style="width:100%;"><i class="fas fa-check"></i> {{ _('Reset Password') }}</button>
        </form>
    </div>
</div>
{% endblock %}
