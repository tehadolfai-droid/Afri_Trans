{% extends "base.html" %}
{% block title %}{{ _('Forgot Password') }} - AFRI Trans{% endblock %}
{% block content %}
<div style="max-width:400px; margin:60px auto;">
    <div class="card" style="text-align:center;">
        <div style="font-size:48px; margin-bottom:8px;"><i class="fas fa-key" style="color:#e67e22;"></i></div>
        <h2 style="color:#1a1a2e; font-size:20px; margin-bottom:4px;">{{ _('Agency Forgot Password') }}</h2>
        <p style="color:#888; font-size:13px; margin-bottom:20px;">{{ _('Enter your agency admin email to receive a reset link.') }}</p>
        <form method="POST">
            <div class="form-group">
                <label style="display:block; text-align:left; font-size:13px; color:#555; margin-bottom:4px;">{{ _('Email Address') }}</label>
                <input type="email" name="email" class="form-control" placeholder="admin@agency.com" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;"><i class="fas fa-paper-plane"></i> {{ _('Send Reset Link') }}</button>
        </form>
        <p style="margin-top:16px; font-size:12px; color:#aaa;">
            <a href="{{ url_for('agency_login') }}" style="color:var(--flag-1);">{{ _('Back to login') }}</a>
        </p>
    </div>
</div>
{% endblock %}
