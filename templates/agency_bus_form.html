{% extends "base.html" %}
{% block title %}{{ _('Add Bus') }} - {{ agency.name }}{% endblock %}
{% block content %}
<div style="max-width:450px; margin:0 auto;">
    <div class="card">
        <h2 class="card-title">{{ _('Add a Bus') }}</h2>
        <form method="POST">
            <div class="form-group">
                <label>{{ _('Plate Number') }}</label>
                <input type="text" name="plate" class="form-control" required placeholder="{{ _('e.g. LT789AB') }}" style="text-transform:uppercase;">
            </div>
            <div class="form-group">
                <label>{{ _('Bus Type') }}</label>
                <select name="bus_type" class="form-control" required onchange="toggleVipPrice(this.value)">
                    <option value="standard">{{ _('Standard') }}</option>
                    <option value="vip">{{ _('VIP') }}</option>
                </select>
            </div>
            <div class="form-group" id="vipPriceGroup" style="display:none;">
                <label>{{ _('VIP Surcharge (extra added to seat price)') }}</label>
                <input type="number" name="vip_price" class="form-control" min="0" placeholder="{{ _('e.g. 5000') }}">
                <small style="color:#888; font-size:11px;">{{ _('This amount will be ADDED to the standard seat price for VIP bookings (e.g. base 5,000 + VIP 3,000 = 8,000)') }}</small>
            </div>
            <div class="form-group">
                <label>{{ _('Capacity (seats)') }}</label>
                <input type="number" name="capacity" class="form-control" required min="14" max="80" value="70">
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">{{ _('Save Bus') }}</button>
        </form>
    </div>
</div>
<script>
function toggleVipPrice(val) {
    document.getElementById('vipPriceGroup').style.display = val === 'vip' ? 'block' : 'none';
}
</script>
{% endblock %}
